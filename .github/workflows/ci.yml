name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx next build
      - run: npm audit --omit=dev --audit-level=high
      - name: Isolated local API and workflow tests
        env:
          DGITA_ENABLE_DEV_LOGIN: "true"
        run: |
          npm run dev -- --port 3001 > /tmp/dgita-e2e.log 2>&1 &
          dgita_server_pid=$!
          trap 'kill "$dgita_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3001/login > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3001/login > /dev/null
          npm run test:e2e
